[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/edh-scout"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
rust-version = "1.88"

[workspace.dependencies]
edhpl = { path = "crates/edhpl" }
edh-data = { path = "crates/edh-data" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
comfy-table = "8.0.1"
directories = "6.0.0"
flate2 = "1.1.11"
indicatif = "0.18.6"
open = "5.4.5"
percent-encoding = "2.3.2"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.1"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.1", features = ["gzip"] }

[profile.release]
lto = "thin"
strip = true
